<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轟Z子 | TODOROKI ZETSUKO — Direction B (Navigation)</title>
  <meta name="description" content="轟Z子（TODOROKI ZETSUKO）— Direction B: navigation system that drives fans to where 轟Z子 is.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800;900&family=Zen+Kaku+Gothic+New:wght@300;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --map-blue: #1f4ed8;
      --map-blue-deep: #16319c;
      --road-red: #ff2030;
      --ink-on-map: #1a2f9a;
      --hud-bg: #000000;
      --hud-ink: #1f4ed8;
      --user-bg: #000000;
      --display: 'Anton', 'Zen Kaku Gothic New', sans-serif;
      --jp: 'Zen Kaku Gothic New', sans-serif;
      --en: 'Inter', sans-serif;
      --serif-jp: 'Noto Serif JP', serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--map-blue);
      color: var(--ink-on-map);
      font-family: var(--jp);
      -webkit-font-smoothing: antialiased;
    }

    /* Variant ribbon */
    .variant-ribbon {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #ffffff;
      color: var(--map-blue-deep);
      font-family: var(--en);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.4rem 1rem;
      font-weight: 700;
    }
    .variant-ribbon a {
      color: var(--map-blue-deep);
      opacity: 0.55;
      text-decoration: none;
      margin: 0 0.55rem;
      transition: opacity 0.3s;
      font-weight: 500;
    }
    .variant-ribbon a:hover { opacity: 1; }
    .variant-ribbon .current { opacity: 1; border-bottom: 1px solid var(--map-blue-deep); padding-bottom: 1px; }

    /* Stage — the whole "navigation screen". */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Map background — tiled and slowly panning so the nav feels alive.
       The source PNG is large (~8MB) so we keep one copy and repeat it. */
    .map-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/dir-b-map.png');
      background-repeat: repeat;
      background-size: auto;
      background-position: 0 0;
      will-change: background-position;
      animation: mapPan 80s linear infinite;
      z-index: 0;
    }

    @keyframes mapPan {
      from { background-position: 0 0; }
      to   { background-position: -1932px -1080px; }
    }

    /* Soft vignette so HUD/bubbles stay legible without obscuring the map */
    .map-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(20, 30, 130, 0.0) 0%, rgba(20, 30, 130, 0.25) 75%, rgba(8, 14, 70, 0.45) 100%);
      pointer-events: none;
    }

    /* HUD: top-left logo block */
    .hud-logo {
      position: absolute;
      top: 1.4rem;
      left: 1.4rem;
      z-index: 20;
      font-family: var(--serif-jp);
      color: #ffffff;
      line-height: 1.1;
      mix-blend-mode: screen;
    }
    .hud-logo .en {
      font-family: var(--en);
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 500;
      display: block;
      margin-bottom: 0.3rem;
      opacity: 0.85;
    }
    .hud-logo .jp {
      font-family: var(--serif-jp);
      font-size: clamp(1.5rem, 2.6vw, 2.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* HUD: top-right date / arrow block */
    .hud-date {
      position: absolute;
      top: 1.4rem;
      right: 1.4rem;
      z-index: 20;
      background: var(--hud-bg);
      padding: 0.7rem 1.2rem;
      border-radius: 3px;
      max-width: 280px;
    }
    .hud-date img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 240px;
    }

    /* Live-venue pin near map center */
    .pin {
      position: absolute;
      top: 28%;
      left: 48%;
      transform: translate(-50%, -100%);
      width: 56px;
      height: auto;
      z-index: 10;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4));
      animation: pinDrop 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s both,
                 pinBob   3.0s ease-in-out infinite 1.5s;
    }

    @keyframes pinDrop {
      from { transform: translate(-50%, -240%); opacity: 0; }
      to   { transform: translate(-50%, -100%); opacity: 1; }
    }
    @keyframes pinBob {
      0%, 100% { transform: translate(-50%, -100%); }
      50%      { transform: translate(-50%, -108%); }
    }

    /* Pin caption above the pin */
    .pin-caption {
      position: absolute;
      top: calc(28% - 70px);
      left: 48%;
      transform: translate(-50%, 0);
      z-index: 11;
      font-family: var(--jp);
      font-size: 0.9rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.45);
      padding: 0.25rem 0.7rem;
      border-radius: 2px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Z子 user-marker (small dot near the bottom of the map) */
    .z-marker {
      position: absolute;
      top: 60%;
      left: 60%;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #ffd8dc 22%, var(--road-red) 60%, #800810 100%);
      border: 3px solid #ffffff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45),
                  0 0 0 6px rgba(255, 255, 255, 0.18);
      z-index: 12;
    }
    .z-marker::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      animation: zPulse 2.2s ease-out infinite;
    }
    @keyframes zPulse {
      0%   { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.9); opacity: 0;   }
    }

    /* Z子 narration bubbles — placeholder image set from the AD */
    .bubbles-zetsuko {
      position: absolute;
      top: 18%;
      left: 4%;
      z-index: 15;
      width: clamp(220px, 22vw, 360px);
      height: auto;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.25));
    }

    /* User's reply bubble — black with a tail */
    .bubble-user {
      position: absolute;
      top: 46%;
      right: 6%;
      z-index: 15;
      width: clamp(120px, 12vw, 180px);
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
      transition: transform 0.2s ease;
    }
    .bubble-user:hover { transform: translateY(-2px) scale(1.03); }

    /* Lower-left distance scale (placeholder, redraw later) */
    .map-scale {
      position: absolute;
      left: 1.4rem;
      bottom: 1.4rem;
      z-index: 20;
      font-family: var(--en);
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: #ffffff;
      display: flex;
      align-items: flex-end;
      gap: 0;
      mix-blend-mode: screen;
    }
    .map-scale .seg {
      width: 22px;
      height: 4px;
      background: #ffffff;
      margin-right: 1px;
      position: relative;
    }
    .map-scale .seg::before {
      content: attr(data-d);
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 0.2rem;
      font-size: 0.55rem;
    }

    /* Lower-right compass (placeholder triangle, redraw later) */
    .map-compass {
      position: absolute;
      right: 1.4rem;
      bottom: 1.4rem;
      z-index: 20;
      width: 40px;
      height: 40px;
      color: #ffffff;
      mix-blend-mode: screen;
      opacity: 0.8;
    }
    .map-compass svg { width: 100%; height: 100%; }

    /* WIP banner */
    .wip-banner {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      background: #ffffff;
      color: var(--map-blue-deep);
      font-family: var(--en);
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 2px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .hud-logo { top: 2.4rem; left: 1rem; }
      .hud-logo .jp { font-size: 1.4rem; }
      .hud-date { top: 2.4rem; right: 1rem; padding: 0.5rem 0.8rem; max-width: 180px; }
      .hud-date img { max-width: 160px; }

      .pin { width: 40px; top: 32%; left: 50%; }
      .pin-caption { top: calc(32% - 56px); left: 50%; font-size: 0.78rem; }

      .z-marker { top: 64%; left: 56%; width: 28px; height: 28px; }

      .bubbles-zetsuko { top: 14%; left: 3%; width: 56vw; max-width: 280px; }
      .bubble-user { top: 50%; right: 4%; width: 30vw; max-width: 140px; }

      .map-scale { left: 1rem; bottom: 1rem; }
      .map-compass { right: 1rem; bottom: 1rem; width: 30px; height: 30px; }

      .wip-banner { bottom: 8px; font-size: 0.5rem; }

      @keyframes mapPan {
        from { background-position: 0 0; }
        to   { background-position: -1200px -700px; }
      }
    }
  </style>
</head>
<body>

  <div class="variant-ribbon">
    <span class="current">Direction B — Navigation System (WIP)</span>
    <a href="direction-a2-3d.html">→ A2</a>
    <a href="direction-a-3d.html">→ A 3D</a>
    <a href="direction-a.html">→ A static</a>
    <a href="index.html">→ V0</a>
  </div>

  <div class="stage">
    <div class="map-bg" aria-hidden="true"></div>

    <div class="hud-logo">
      <span class="en">Todoroki Zetsuko · Official Site</span>
      <span class="jp">轟乙子</span>
    </div>

    <div class="hud-date" aria-label="Next live: 5/17 (Sun)">
      <img src="images/dir-b-hud-date.png" alt="次のライブまで 5/17 (日) →">
    </div>

    <div class="pin-caption">次のライブはココ！↓</div>
    <img class="pin" src="images/dir-b-pin.png" alt="ライブ会場マーカー">

    <div class="z-marker" aria-label="現在地: 轟Z子" title="現在地"></div>

    <img class="bubbles-zetsuko" src="images/dir-b-bubble-zetsuko.png" alt="Z子からのナビゲーション: 次のライブは5月17日(日)だよ! 渋谷方面に〇〇km !! 料金は2000円です♡">

    <img class="bubble-user" src="images/dir-b-bubble-user.png" alt="ユーザー: いくら?" tabindex="0" role="button">

    <div class="map-scale" aria-hidden="true">
      <span class="seg" data-d="1,000"></span>
      <span class="seg" data-d="500"></span>
      <span class="seg" data-d="100"></span>
    </div>

    <div class="map-compass" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="20" cy="20" r="14" />
        <path d="M20 8 L24 22 L20 18 L16 22 Z" fill="currentColor" stroke="none"/>
        <text x="20" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="currentColor" stroke="none">N</text>
      </svg>
    </div>
  </div>

  <div class="wip-banner">B · Navigation WIP</div>

  <script>
    // Stub for future interactivity: when the user clicks the "いくら?" bubble,
    // a Z子 narration line is queued. The real implementation will hook into
    // an AI / remote-control backend; for now it's a no-op placeholder.
    const userBubble = document.querySelector('.bubble-user');
    if (userBubble) {
      userBubble.addEventListener('click', () => {
        userBubble.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(0.94)' }, { transform: 'scale(1)' }],
          { duration: 220, easing: 'ease-out' }
        );
        // TODO: trigger Z子 reply pipeline (remote prompt / AI fallback).
      });
    }
  </script>

</body>
</html>
